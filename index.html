<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رقيب | RAQEEB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;600&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="globe"></div>
<header id="top"><div class="brand"><svg viewBox="0 0 48 38" fill="none" stroke="#5ee0c8" stroke-width="1.6" aria-hidden="true"><ellipse cx="24" cy="19" rx="22" ry="8.5" transform="rotate(-18 24 19)" opacity=".75"/><circle cx="24" cy="19" r="10"/><circle cx="20.5" cy="19.5" r="2.2" fill="#5ee0c8" stroke="none"/><circle cx="40.5" cy="11" r="2.3" fill="#5ee0c8" stroke="none"/></svg><span class="ar">رقيب</span><span class="en">RAQEEB</span></div>
<div class="topr"><div class="hbtns"><button class="btn" id="stbtn">&#9654; Start the story</button><button class="btn ghost" id="cmpbtn">Compare radar</button><button class="btn ghost" id="dashbtn">Dashboard</button><button class="btn ghost" id="aboutbtn">About</button></div><span class="live">NISAR Earth Observatory</span></div></header>
<div id="hero"><div class="kick">NASA · ISRO NISAR mission</div><h2>The Earth is always changing.</h2><p id="sub"></p></div>
<div id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span class="tx"></span><button class="hx" id="hintx" aria-label="Close">&times;</button></div>
<nav id="side" aria-label="Explore by force"><p class="fh">Explore by force</p><div id="forces"></div><p class="fnote">Choose a force to reveal its story.</p><span id="prog"></span></nav>
<div id="foot"></div>
<aside id="panel" aria-live="polite"></aside>
<div class="ov" id="rep"><div><div id="card"></div><div class="acts">
<button class="btn" id="dl">Download as image</button><button class="btn" id="sh">Share</button><button class="btn ghost" id="rc">Close</button></div></div></div>
<div class="ov" id="cmpov"><div class="cmpcard"><div id="cmpbody"></div><div class="acts"><button class="btn ghost" id="cmpx">Close</button></div></div></div>
<div id="story" role="dialog" aria-label="Story"><div class="sx"><img id="s1" alt=""><img id="s2" alt="" style="opacity:0"></div><div style="flex:1"><div class="sn" id="sn"></div><h3 id="sh3"></h3><p id="stx"></p><div class="acts"><button class="btn ghost" id="sprev">Back</button><button class="btn" id="snext">Next</button><button class="btn ghost" id="sexit">Exit</button></div></div></div>
<div class="ov" id="end"><div class="box"><h3>All places explored</h3><b id="score"></b><p id="scoreTxt"></p><p id="endFuture" class="ldesc"></p><button class="btn" id="again">Explore again</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
